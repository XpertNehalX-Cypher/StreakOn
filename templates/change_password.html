<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change StreakOn Password</title>
    <link rel="icon" type="image/png" style="object-fit:cover;" href="{{ url_for('static', filename='THE_APP2.png') }}">
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --blue-accent: #2563eb;
            --blue-hover: #1d4ed8;
            --blue-light: #eff6ff;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .shape-blob-1 {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(37,99,235,0.08) 0%, rgba(255,255,255,0) 70%);
            top: -60px;
            left: -60px;
            border-radius: 50%;
            z-index: 0;
        }

        .shape-blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(147,197,253,0.12) 0%, rgba(255,255,255,0) 70%);
            bottom: -100px;
            right: -100px;
            border-radius: 50%;
            z-index: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            position: relative;
            z-index: 1;
        }

        .header {
            margin-bottom: 24px;
            text-align: left;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--blue-accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn-submit {
            margin-top: 8px;
            padding: 12px;
            background-color: var(--blue-accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: var(--blue-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.875rem;
            color: var(--blue-accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        .back-link:hover {
            color: var(--blue-hover);
            text-decoration: underline;
        }

        .alert {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .alert-error {
            background-color: #fef2f2;
            color: var(--error);
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <div class="shape-blob-1"></div>
    <div class="shape-blob-2"></div>

    <div class="card">
        <div class="header">
            <h1>Change Password</h1>
            <p class="subtitle">Enter your current password to set a new one.</p>
        </div>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('auth.change_password') }}" method="POST">
            <div class="input-group">
                <label for="old_password">Current Password</label>
                <input type="password" id="old_password" name="old_password" required placeholder="••••••••">
            </div>

            <div class="input-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required placeholder="••••••••">
            </div>

            <div class="input-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <a href="{{ url_for('profile') }}" class="back-link">← Cancel and return</a>
    </div>

</body>
</html>
