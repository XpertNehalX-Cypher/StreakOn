<!DOCTYPE html>
 <html lang="en">
 <head>
 <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='THE_APP2.png') }}">
 <title>Login</title>

 <style>
  body {
 background-color: #011849;
 color:rgb(20, 34, 65);
 font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
 text-align: center;
 
 }
 .container{
 display: flex;
 flex-direction: column;
 align-items: center;
 height: 100vh;
 justify-content: center;
 background-color: #011849;

 } 
 
 .form {
 display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                color: white;
                justify-content: center;
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(17px);
                -webkit-backdrop-filter: blur(18px);
                color: black;
                padding: 25px;
                border-radius: 20px;
                border: 1px solid rgba(255,255,255,0.31);
                box-shadow: 
                0 8px 32px rgba(0,0,0,0.1),
                inset 0 1px 0 rgba(0,0,0,0.2),
                inset 0 1px 0 rgba(255,255,255,0.1),
                inset 0 0 18px 9px rgba(0, 0, 0, 0.2);
                position: relative;
                overflow: hidden;
                width: 250px;
                height: 300px;
                margin-top: 40px;
            }

			.form::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                height: 1px;
                width: 100%;
                background: linear-gradient(90deg, transparent, rgba(255,255,255, 0.8), transparent); 
               }

            .form::after {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 1px;
                height: 100%;
                background: linear-gradient(180deg,
    rgba(255, 255, 255, 0.10),
    transparent,
    rgba(255, 255, 255, 0.3)
  );
            }
 
 form {
 display: flex;
 flex-direction: column;
 gap: 10px;
 }
 
 input, button {
 padding: 10px;
 border-radius: 20px;
 color: green;
 font-size: 18px;
 }
 
 span {
 	color: white;
 }
 
 h1 {
 	color: Yellow;
	font-size: 40px;
    font-style: Georgia;
}
 
 a {
 	color: pink;
 }
 

 </style>
 </head>
 <body>
 <div class="container">
 <div class="form">
 <h1>Login</h1>
 <form action="/login" method="post">
 <input type="text" name="username" placeholder="Username">
 <input type="password" name="password" placeholder="Password">
 <button type="submit">Login</button>
 <p><span>Don't have an account?</span> <a href='/register'>Register</a></p>
 
 </form>
 </div>
 </div>
 </body>

 </html>
